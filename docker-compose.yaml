name: dme-marketing

services:
  db:
    image: mysql:8.0
    container_name: dme_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_campaign_assistant}
      MYSQL_USER: ${MYSQL_USER:-ai_campaign_assistant_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_campaign_assistant_secret}
    ports:
      # 3307 on the host to avoid clashing with other local MySQL containers
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dme_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
